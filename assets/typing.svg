<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 650 50'
    style='background-color: #00000000;'
    width='650px' height='50px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 600;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d1.end'
                    dur='3800ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h650 ; m0,25 h650 ; m0,25 h0' keyTimes='0;0.63157894736842;0.84210526315789;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#00FF9D' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            &gt; Learning Cybersecurity every day
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='3800ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h650 ; m0,25 h650 ; m0,25 h0' keyTimes='0;0.63157894736842;0.84210526315789;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#00FF9D' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            &gt; Googling errors like a pro
        </textPath>
    </text>
</svg>
